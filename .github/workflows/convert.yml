name: Convert TTF to WOFF2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install woff2 tools
        run: sudo apt-get update && sudo apt-get install -y woff2

      - name: Convert font
        run: |
          woff2_compress NotoColorEmoji.ttf
          ls -l

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: emoji-font
          path: NotoColorEmoji.woff2
